services:
  # ============================================================================
  # AAYAM Backend API — Render Web Service
  # ============================================================================
  - type: web
    name: aayam-backend
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/health"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: APP_NAME
        value: AAYAM Infrastructure Intelligence API
      - key: DATABASE_URL
        fromDatabase:
          name: aayam-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 480
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://aayam.vercel.app"
      - key: CORS_ORIGIN_REGEX
        value: "^https://.*\\.vercel\\.app$"
      # OpenRouter Cloud AI Intelligence (Set your API key in Render Dashboard)
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: "https://openrouter.ai/api/v1"
      - key: OPENROUTER_MODEL
        value: "openai/gpt-4o"
      - key: OPENROUTER_SITE_URL
        value: "https://aayam.vercel.app"
      - key: OPENROUTER_APP_NAME
        value: "AAYAM Infrastructure Intelligence"
    disk:
      name: aayam-data
      mountPath: /var/data
      sizeGB: 1

# ==============================================================================
# AAYAM Managed PostgreSQL Database
# ==============================================================================
databases:
  - name: aayam-db
    databaseName: aayam_infra
    user: aayam
    region: oregon
    plan: starter
