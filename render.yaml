services:
  # ============================================================================
  # AAYAM Backend API — Render Web Service (Free Tier)
  # ============================================================================
  - type: web
    name: aayam-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/health"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: APP_NAME
        value: AAYAM Infrastructure Intelligence API
      # Supabase PostgreSQL Free Tier Connection String
      # Example: postgresql://postgres.[REF]:[PASSWORD]@aws-0-[REGION].pooler.supabase.com:6543/postgres
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: CORS_ORIGINS
        value: "https://aayam.vercel.app"
      # OpenRouter Cloud AI Intelligence (sk-or-v1-...)
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: "https://openrouter.ai/api/v1"
      - key: OPENROUTER_MODEL
        value: "openai/gpt-4o"
      - key: OPENROUTER_SITE_URL
        value: "https://aayam.vercel.app"
      - key: OPENROUTER_APP_NAME
        value: "AAYAM Infrastructure Intelligence"
      # Supabase Storage Free Tier (Remote Media & Evidence Object Storage)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET_MEDIA
        value: "aayam-media"
      - key: SUPABASE_STORAGE_BUCKET_EVIDENCE
        value: "aayam-evidence"
